{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow mt-3 mb-5">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Submit E-Waste Details</h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <h5 class="text-success border-bottom pb-2 mb-3">Item Details</h5>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select" required>
                                <option value="">Select Category</option>
                                <option value="Mobile Phones">Mobile Phones</option>
                                <option value="Laptops & Computers">Laptops & Computers</option>
                                <option value="Monitors & Displays">Monitors & Displays</option>
                                <option value="Printers">Printers</option>
                                <option value="Accessories">Accessories (Keyboards, Mice, Cables)</option>
                                <option value="Batteries">Batteries</option>
                                <option value="Small Appliances">Small Electronic Appliances</option>
                                <option value="Other">Other Electronic Items</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Item Name</label>
                            <input type="text" name="item_name" class="form-control" placeholder="e.g., Old Dell Laptop" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Quantity</label>
                            <input type="number" name="quantity" class="form-control" value="1" min="1" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Condition</label>
                            <select name="condition" class="form-select">
                                <option value="Working">Working</option>
                                <option value="Partially Working">Partially Working</option>
                                <option value="Not Working">Not Working</option>
                                <option value="Broken">Broken</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Estimated Weight (kg)</label>
                            <input type="number" step="0.1" name="weight" class="form-control" placeholder="e.g. 2.5" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Item Photo (Optional)</label>
                        <input type="file" name="photo" class="form-control" accept="image/*">
                    </div>

                    <h5 class="text-success border-bottom pb-2 mb-3">Collection Preference</h5>
                    
                    <div class="mb-3">
                        <label class="form-label d-block">How would you like to hand over?</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="pickup_mode" id="pickup" value="pickup" checked>
                            <label class="form-check-label" for="pickup">Schedule Pickup</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="pickup_mode" id="dropoff" value="dropoff">
                            <label class="form-check-label" for="dropoff">Self Drop-off (Center)</label>
                        </div>
                    </div>

                    <div class="row mb-3" id="schedule_details">
                        <div class="col-md-6">
                            <label class="form-label">Preferred Date</label>
                            <input type="date" name="date" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Time Slot</label>
                            <select name="time_slot" class="form-select">
                                <option value="Morning (9 AM - 12 PM)">Morning (9 AM - 12 PM)</option>
                                <option value="Afternoon (12 PM - 4 PM)">Afternoon (12 PM - 4 PM)</option>
                                <option value="Evening (4 PM - 7 PM)">Evening (4 PM - 7 PM)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Collection/Pickup Address</label>
                        <textarea name="address" class="form-control" rows="2" required>{{ current_user.address }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-success w-100 btn-lg">Submit E-Waste Request</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Simple toggle logic for pickup details if needed
</script>
{% endblock %}
